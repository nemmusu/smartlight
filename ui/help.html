<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Smartlight · Help</title><link rel="icon" href="smartlight.svg" type="image/svg+xml"><style>
    :root{color-scheme:dark;font-family:'Segoe UI',system-ui,sans-serif;--ink:#edf6fd;--muted:#a8bac9;--line:#345064;--panel:#182b3d;--cyan:#83e2ec;--gold:#ffc783}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 10% -5%,#284c64 0,transparent 31%),#0c1928;color:var(--ink);line-height:1.5}
    a{color:#9adff6}a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}code{font-family:ui-monospace,Cascadia Code,Consolas,monospace;color:#e9d4ae;font-size:.94em}main{max-width:1050px;margin:auto;padding:28px 24px 70px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:9px;color:#effaff;text-decoration:none;font-size:19px;font-weight:800}.brand img{width:35px;height:35px}.brand span span{color:var(--cyan)}.date{font-size:12px;color:var(--muted)}
    .hero{margin-top:31px;padding:30px 34px;background:linear-gradient(118deg,#203d55,#172b41 72%,#3d354b);border:1px solid #52728a;border-radius:22px;box-shadow:0 20px 60px #0003}.kicker{color:var(--cyan);font-size:11px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(29px,5vw,45px);line-height:1.1;max-width:700px;margin:10px 0}.hero p{max-width:760px;color:#c7d8e5;margin:0}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.pill{border-radius:999px;background:#19394c;border:1px solid #4a7a8d;padding:6px 10px;font-size:11px;font-weight:700;color:#d9f9fa}.pill.muted{background:#2d3545;border-color:#596274;color:#e0e3ec}.pill.warn{background:#51402c;border-color:#9c7347;color:#ffe3b4}
    h2{font-size:23px;margin:36px 0 8px}.intro{color:var(--muted);margin:0 0 18px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px}.card h3{margin:0 0 5px;font-size:17px}.card p{font-size:13px;color:#b7c9d6;margin:0}.card small{display:block;font-size:11px;color:#8eabb9;margin-top:11px}.card .type{color:var(--cyan);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:6px}.tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#244759;color:#b7eff3;font-size:10px;font-weight:800;margin:9px 6px 0 0}.tag.gold{background:#4b3b30;color:#ffd49d}
    table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #314558;vertical-align:top}th{font-size:11px;letter-spacing:.06em;color:#9dbbca;text-transform:uppercase;background:#203548}tr:last-child td{border:0}td:first-child{font-weight:700;min-width:185px}td:nth-child(2){color:#c3d0dc}.note{margin-top:13px;padding:13px 16px;border:1px solid #6c624c;border-radius:12px;color:#eed9b1;background:#3e3529;font-size:12px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.step{background:#182b3d;border:1px solid #365266;border-radius:14px;padding:17px}.step strong{display:block;color:var(--gold);margin-bottom:7px}.step p{color:#b8cbd7;font-size:12px;margin:0}.sources{font-size:12px;color:#9fb2c1;padding-top:22px;border-top:1px solid #355066;margin-top:35px}.sources a{margin-right:11px;line-height:2}
    .catalog-controls{display:grid;grid-template-columns:minmax(200px,2fr) repeat(3,minmax(135px,1fr));gap:10px;margin:18px 0}.catalog-controls label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:800;color:#b7d1dc;letter-spacing:.03em}.catalog-controls input,.catalog-controls select{width:100%;min-height:42px;border:1px solid #557084;background:#13283a;color:#f4fbff;border-radius:9px;padding:9px 11px;font:inherit;font-size:13px}.catalog-controls input:focus-visible,.catalog-controls select:focus-visible,.more:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.catalog-summary{font-size:13px;color:#b7d1dc;margin:7px 0 13px}.catalog-list{display:grid;gap:9px}.catalog-row{background:#172b3e;border:1px solid #365266;border-radius:12px;padding:13px 15px}.catalog-row-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.catalog-row h3{font-size:14px;line-height:1.3;margin:0 0 5px}.catalog-row .meta{font-size:11px;color:#9ec3d3}.catalog-row .features{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.catalog-row .feature{border:1px solid #486476;border-radius:6px;background:#233e51;color:#d7eaf2;padding:3px 7px;font-size:10px}.catalog-row .feature.issue{border-color:#a17a50;color:#ffe4b6;background:#4a3b2c}.catalog-row .feature.off{border-color:#5c6470;color:#c1c8d2;background:#2b3542}.catalog-row details{margin-top:9px;color:#b8cbd7;font-size:11px}.catalog-row summary{cursor:pointer;color:#9adff6}.catalog-row details p{white-space:pre-line;margin:6px 0 0}.more{display:block;margin:15px auto 0;border:1px solid #5c899c;border-radius:9px;padding:10px 17px;background:#23485c;color:#e9faff;font-weight:700;cursor:pointer}.catalog-note{font-size:12px;color:#b8cbd7;margin-top:13px}.catalog-note strong{color:#ffda9e}
    @media(max-width:760px){main{padding-inline:15px}.grid,.steps{grid-template-columns:1fr}.hero{padding:24px}.top{align-items:flex-start}table{display:block;background:none;border:0;overflow:visible}thead{display:none}tbody{display:grid;gap:9px}tr{display:block;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}td,td:first-child{display:block;min-width:0;border:0;padding:3px 0}td:first-child{font-size:14px;margin-bottom:5px}td:nth-child(2)::before{content:'BACKEND · ';color:#86d6e5;font-size:10px;font-weight:800}td:nth-child(3)::before{content:'EVIDENZA · ';color:#86d6e5;font-size:10px;font-weight:800}}
    @media(max-width:760px){.catalog-controls{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-controls label:first-child{grid-column:1/-1}}
    @media(max-width:430px){.catalog-controls{grid-template-columns:1fr}.catalog-controls label:first-child{grid-column:auto}.catalog-row-head{display:block}}
  </style><style>main>section>p{color:var(--muted)}#help-language{min-height:38px;border:1px solid #557084;border-radius:9px;background:#13283a;color:#edf6fd;padding:8px;font:inherit}.top label{font-size:13px}.top{flex-wrap:wrap}</style></head><body><main><header class="top"><a class="brand" href="index.html"><img src="smartlight.svg" alt=""><span>smart<span>light</span></span></a><label><span data-t="language"></span> <select id="help-language" aria-label="Lingua / Language"><option value="it">Italiano</option><option value="en">English</option></select></label></header><section class="hero"><h1 data-t="title"></h1><p data-t="intro"></p></section><section><h2 data-t="start-title"></h2><p data-t="start"></p></section><section><h2 data-t="control-title"></h2><p data-t="control"></p></section><section><h2 data-t="effects-title"></h2><p data-t="effects"></p></section><p class="note" data-t="running"></p><section><h2 data-t="compat-title"></h2><p data-t="compat"></p><div class="grid"><article class="card"><h3>Tapo</h3><p data-t="tapo"></p></article><article class="card"><h3 data-t="pc-title"></h3><p data-t="pc"></p></article></div><p class="note" data-t="platform"></p></section><section><h2 data-t="catalog-title"></h2><p data-t="catalog-intro"></p><div class="catalog-controls" role="search"><label><span data-t="model"></span><input id="catalog-search" type="search" autocomplete="off"></label><label><span data-t="category"></span><select id="catalog-category"><option value="" data-t="all-categories"></option></select></label><label><span data-t="brand"></span><select id="catalog-brand"><option value="" data-t="all-brands"></option></select></label><label><span data-t="direct"></span><select id="catalog-direct"><option value="" data-t="any"></option><option value="yes" data-t="yes"></option><option value="issue" data-t="issue"></option><option value="no" data-t="no"></option></select></label></div><p id="catalog-summary" class="catalog-summary" role="status" aria-live="polite"></p><div id="catalog-list" class="catalog-list"></div><button id="catalog-more" class="more" type="button" hidden data-t="more"></button><p class="catalog-note" data-t="catalog-note"></p><p class="catalog-note"><a href="openrgb_devices_1.0rc2.csv" download data-t="download"></a> · <a href="https://openrgb.org/devices_1.0rc2.html" data-t="official"></a></p><noscript><p>OpenRGB: <a href="openrgb_devices_1.0rc2.csv">CSV</a> · <a href="https://openrgb.org/devices_1.0rc2.html">Official device list</a>. JavaScript is required for the searchable guide.</p></noscript></section><section><h2 data-t="mcp-title"></h2><p data-t="mcp"></p><p data-t="backup"></p></section><footer class="sources"><strong data-t="sources"></strong><br><a href="https://openrgb.org/releases.html">OpenRGB</a><a href="https://openrgb.org/devices_1.0rc2.html" data-t="official"></a><a href="https://github.com/CorsairOfficial/cue-sdk">Corsair iCUE SDK (Windows)</a><a href="https://github.com/python-kasa/python-kasa">python-kasa</a><p data-t="source-note"></p></footer></main><script src="compatibility_data.js"></script><script>const helpTexts={"it": {"title": "Luci, effetti e compatibilità", "intro": "Smartlight controlla luci Tapo e RGB del computer da una sola interfaccia. Il software è stato testato su Windows e Linux con dispositivi delle integrazioni dichiarate compatibili. Le funzioni disponibili dipendono dal modello, dal firmware e dal sistema.", "start-title": "Primo avvio", "start": "Collega computer e Tapo alla stessa rete e inserisci le credenziali in Impostazioni → Account quando richiesto. Per le luci PC lascia Automatico: Smartlight rileva hardware e software disponibili e indica eventuali componenti mancanti con il collegamento ufficiale. Completa soltanto i passaggi richiesti dal produttore; non devi cercare o selezionare DLL.", "control-title": "Blocchi, stanze e selezione", "control": "Ogni comando riguarda la destinazione indicata accanto ai controlli. Nel Workspace puoi unire luci Tapo e RGB PC nello stesso blocco e includere un dispositivo in più blocchi. Le stanze Smartlight sono indipendenti dalle stanze dell’app Tapo. In Luci PC il pulsante di categoria seleziona o deseleziona la categoria. I comandi “Luci PC” riguardano soltanto l’illuminazione del computer.", "effects-title": "Effetti, preset e programmazioni", "effects": "Scegli prima la destinazione, poi una categoria in Effetti & preset. La disponibilità dipende dall’hardware selezionato. Per respiro e pulsazione scegli luminosità massima, minima e velocità; il minimo 0% richiede transizioni native compatibili. I preset Smartlight sono distinti da quelli nativi Tapo. In Automazioni scegli azione, destinazione e orario, poi una data nel calendario oppure i giorni della settimana. I timer eseguono l’azione dopo la durata scelta.", "running": "Lascia Smartlight in esecuzione per animazioni locali, sincronizzazione, programmazioni e timer, anche con la finestra nascosta nell’area di notifica. Finestra, area di notifica e MCP usano lo stesso servizio. Lo stato Tapo viene riletto periodicamente per rilevare anche comandi e timer dell’app ufficiale: l’aggiornamento può richiedere alcuni secondi.", "compat-title": "Compatibilità hardware", "compat": "Le integrazioni Tapo e OpenRGB sono state testate su Windows e Linux; iCUE è riservato a Windows. Le prove non certificano singolarmente tutti i modelli del catalogo OpenRGB. Verifica sempre rilevamento e funzioni offerte dal dispositivo specifico.", "tapo": "Luci Tapo compatibili con il controllo locale, incluse lampadine L530 e strisce L900. Accensione, colore, bianco, luminosità, effetti e consumi compaiono quando modello e firmware li espongono. Gli effetti personalizzati nativi possono differire tra lampadine e strisce.", "pc-title": "RGB del computer", "pc": "Automatico prova OpenRGB e, su Windows, iCUE. Il collegamento MSI sperimentale viene considerato se non trovano luci PC. Puoi anche scegliere soltanto OpenRGB, iCUE o MSI Mystic Light su Windows; su Linux Automatico o OpenRGB. La scelta manuale OpenRGB include anche Corsair. Dopo una modifica usa Applica e riavvia.", "platform": "Pronto richiede dispositivi o zone realmente controllabili: il solo software installato non basta. L’SDK MSI può essere scaricato e verificato automaticamente solo quando sono rilevati sia hardware MSI sia il software richiesto. MSI resta sperimentale, senza prova fisica. Su Linux si usa solo OpenRGB, anche per Corsair; iCUE e SDK MSI non vengono usati.", "catalog-title": "Catalogo OpenRGB", "catalog-intro": "Catalogo offline della lista ufficiale OpenRGB 1.0rc2, acquisita il 1 ottobre 2026. La presenza di un modello non garantisce tutte le funzioni né una prova individuale con Smartlight. Il supporto dipende anche da revisione hardware, sistema e driver.", "catalog-note": "Gli stati distinguono controllo diretto, effetti e salvataggio: ✔️ supportato; 🚨 problematico; ⚒️ parziale; 🚫 non supportato; 🤖 automatico; ❌ non applicabile. Nomi dei modelli, controller e note mantengono il testo originale OpenRGB.", "mcp-title": "MCP e backup", "mcp": "In Impostazioni → Server MCP scegli la connessione locale stdio o il server HTTP. Inizia con get_lighting_overview per conoscere luci, identificativi, categorie e stato. set_color, set_lights_power e set_lights_brightness accettano destinazioni comuni. I nomi degli strumenti e i parametri non cambiano passando da Italiano a English.", "backup": "Usa Impostazioni → Backup per esportare o importare gruppi, preset e configurazioni. Credenziali e token MCP restano separati; potrebbe essere necessario reinserirli dopo un ripristino. La lingua si sceglie in Impostazioni → Generali. Nomi personalizzati di dispositivi, stanze e preset non vengono tradotti.", "sources": "Fonti delle integrazioni", "source-note": "Il catalogo incluso conserva l’attribuzione OpenRGB (GPLv2). Per altri modelli o revisioni verifica le funzioni effettivamente esposte dal backend.", "language": "Lingua", "model": "Modello, marca o controller", "category": "Categoria", "brand": "Marca o famiglia", "direct": "Controllo diretto", "all-categories": "Tutte le categorie", "all-brands": "Tutte le marche", "any": "Qualsiasi stato", "yes": "Disponibile", "issue": "Problematico / parziale", "no": "Assente / non applicabile", "placeholder": "Cerca modello, marca o controller", "more": "Mostra altri dispositivi", "download": "Scarica il CSV incluso", "official": "Lista ufficiale dispositivi"}, "en": {"title": "Lights, effects and compatibility", "intro": "Smartlight controls Tapo lights and computer RGB from one interface. The software has been tested on Windows and Linux with devices from the declared compatible integrations. Available features depend on the model, firmware and operating system.", "start-title": "Getting started", "start": "Connect the computer and Tapo lights to the same network and enter your credentials in Settings → Account when requested. For PC lights, keep Automatic selected: Smartlight detects available hardware and lighting software and shows missing components with their official links. Complete only the steps required by the manufacturer; you do not need to find or select DLL files.", "control-title": "Blocks, rooms and selection", "control": "Each command applies to the target shown beside its controls. In Workspace, you can combine Tapo and PC RGB in the same block and include a device in multiple blocks. Smartlight rooms are independent of rooms in the Tapo app. In PC Lights, the category button selects or deselects its category. “PC Lights” commands affect computer lighting only.", "effects-title": "Effects, presets and schedules", "effects": "Choose a target first, then a category in Effects & presets. Availability depends on the selected hardware. For breathing and pulse, choose maximum brightness, minimum brightness and speed; a 0% minimum requires compatible native transitions. Smartlight presets are separate from native Tapo presets. In Automations, choose an action, target and time, then a calendar date or days of the week. Timers run the action after your chosen duration.", "running": "Keep Smartlight running for local animations, synchronization, schedules and timers, including with its window hidden in the tray. The window, tray and MCP use the same service. Tapo status is read periodically to detect commands and timers from the official app; updates may take a few seconds.", "compat-title": "Hardware compatibility", "compat": "Tapo and OpenRGB integrations have been tested on Windows and Linux; iCUE is Windows only. These tests do not individually certify every model in the OpenRGB catalog. Always check detection and features exposed by the specific device.", "tapo": "Tapo lights compatible with local control, including L530 bulbs and L900 strips. Power, color, white temperature, brightness, effects and energy data appear when exposed by the model and firmware. Native custom effects can differ between bulbs and strips.", "pc-title": "Computer RGB", "pc": "Automatic tries OpenRGB and, on Windows, iCUE. The experimental MSI connection is considered if they find no PC lights. You can also select only OpenRGB, iCUE or MSI Mystic Light on Windows; Linux offers Automatic or OpenRGB. Manual OpenRGB mode also includes Corsair. Use Apply and restart after changing the selection.", "platform": "Ready requires actual controllable devices or zones: installed software alone is insufficient. The MSI SDK can be downloaded and verified automatically only when both MSI hardware and required software are detected. MSI remains experimental, without physical validation. Linux uses OpenRGB only, including for Corsair; iCUE and the MSI SDK are not used.", "catalog-title": "OpenRGB catalog", "catalog-intro": "Offline catalog of the official OpenRGB 1.0rc2 device list, captured on October 1, 2026. Listing a model does not guarantee every feature or individual testing with Smartlight. Support also depends on the hardware revision, operating system and drivers.", "catalog-note": "Statuses distinguish direct control, effects and saving: ✔️ supported; 🚨 problematic; ⚒️ partial; 🚫 unsupported; 🤖 automatic; ❌ not applicable. Model names, controllers and notes retain the original OpenRGB text.", "mcp-title": "MCP and backups", "mcp": "In Settings → MCP Server, choose a local stdio connection or the HTTP server. Start with get_lighting_overview to discover lights, identifiers, categories and status. set_color, set_lights_power and set_lights_brightness share common targets. Tool names and parameters remain unchanged when switching between Italian and English.", "backup": "Use Settings → Backup to export or import groups, presets and settings. Credentials and MCP tokens remain separate; you may need to enter them again after restoring. Choose the language in Settings → General. Custom device, room and preset names are not translated.", "sources": "Integration sources", "source-note": "The included catalog retains OpenRGB attribution (GPLv2). For other models or revisions, check the features actually exposed by the backend.", "language": "Language", "model": "Model, brand or controller", "category": "Category", "brand": "Brand or family", "direct": "Direct control", "all-categories": "All categories", "all-brands": "All brands", "any": "Any status", "yes": "Available", "issue": "Problematic / partial", "no": "Absent / not applicable", "placeholder": "Search model, brand or controller", "more": "Show more devices", "download": "Download included CSV", "official": "Official device list"}};
window.helpLanguage='en';try{const requested=new URLSearchParams(location.search).get('lang');window.helpLanguage=['it','en'].includes(requested)?requested:(localStorage.getItem('smartlight.language')==='it'?'it':'en')}catch{}
const helpTerms={'supportato':'supported','problematico':'problematic','parziale':'partial','non supportato':'unsupported','automatico':'automatic','non applicabile':'not applicable','avviso':'warning','non indicato':'not specified','Controller':'Controller','Collegamento':'Connection','Diretto':'Direct','Effetti':'Effects','Salvataggio':'Saving','Note della fonte OpenRGB':'Original OpenRGB source notes','Catalogo locale non disponibile. Apri la lista ufficiale OpenRGB dal collegamento qui sopra.':'Local catalog unavailable. Open the official OpenRGB list linked above.'};
window.helpTranslate=value=>window.helpLanguage==='en'?(helpTerms[value]||value):value;
const helpCategories={"Accessory": "Accessori", "Case": "Case", "Cooler": "Raffreddamento", "DEVICE_TYPE_KEYBOARD": "Tastiere", "GPU": "Schede video", "Gamepad": "Controller di gioco", "Headset": "Cuffie", "HeadsetStand": "Supporti cuffie", "Keyboard": "Tastiere", "Keyboard/Controller": "Tastiere / controller", "LEDStrip": "Strisce LED", "Light": "Luci", "Microphone": "Microfoni", "MotherBoard": "Schede madri", "Motherboard": "Schede madri", "Mouse": "Mouse", "Mousemat": "Tappetini", "RAM": "RAM", "Speaker": "Altoparlanti", "Storage": "Archiviazione", "Unknown": "Altro"};
window.helpCategoryLabel=value=>window.helpLanguage==='it'?(helpCategories[value]||value):(value==='DEVICE_TYPE_KEYBOARD'?'Keyboard':value==='MotherBoard'?'Motherboard':value==='HeadsetStand'?'Headset stand':value==='LEDStrip'?'LED strip':value);
function setHelpLanguage(value,persist=false){window.helpLanguage=value==='it'?'it':'en';const lang=window.helpLanguage;document.documentElement.lang=lang;document.title='Smartlight · '+(lang==='en'?'Help':'Aiuto');document.getElementById('help-language').value=lang;for(const el of document.querySelectorAll('[data-t]'))el.textContent=helpTexts[lang][el.dataset.t];document.getElementById('catalog-search').placeholder=helpTexts[lang].placeholder;for(const option of document.querySelectorAll('#catalog-category option'))if(option.value)option.textContent=window.helpCategoryLabel(option.value);if(persist){try{localStorage.setItem('smartlight.language',lang)}catch{}try{const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url)}catch{}}window.helpCatalogUpdate?.()}
document.getElementById('help-language').addEventListener('change',event=>setHelpLanguage(event.target.value,true));window.addEventListener('storage',event=>{if(event.key==='smartlight.language')setHelpLanguage(event.newValue)});setHelpLanguage(window.helpLanguage);
</script><script>
(() => {
  const tr = value => window.helpTranslate(value);
  const data = window.SMARTLIGHT_OPENRGB_CATALOG;
  const list = document.getElementById('catalog-list');
  const summary = document.getElementById('catalog-summary');
  const more = document.getElementById('catalog-more');
  const search = document.getElementById('catalog-search');
  const category = document.getElementById('catalog-category');
  const brand = document.getElementById('catalog-brand');
  const direct = document.getElementById('catalog-direct');
  if (!data || !Array.isArray(data.devices)) {
    summary.textContent = tr('Catalogo locale non disponibile. Apri la lista ufficiale OpenRGB dal collegamento qui sopra.');
    return;
  }
  const devices = data.devices;
  const categories = [...new Set(devices.flatMap(item => item.c))].sort((a, b) => a.localeCompare(b, 'it'));
  const brands = [...new Set(devices.map(item => item.b))].sort((a, b) => a.localeCompare(b, 'it'));
  for (const value of categories) category.add(new Option(window.helpCategoryLabel(value), value));
  for (const value of brands) brand.add(new Option(value, value));
  const statusText = { '✔️':'supportato', '🚨':'problematico', '⚒️':'parziale', '🚫':'non supportato', '🤖':'automatico', '❌':'non applicabile', ':warning:':'avviso' };
  const statusClass = value => value === '🚨' || value === '⚒️' || value === ':warning:' ? 'issue' : value === '❌' || value === '🚫' || !value ? 'off' : '';
  let filtered = devices;
  let shown = 0;
  function makeText(tag, className, value) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = value;
    return el;
  }
  function addFeature(parent, label, value) {
    const el = makeText('span', `feature ${statusClass(value)}`, `${tr(label)}: ${value || '—'} ${tr(statusText[value] || 'non indicato')}`);
    parent.appendChild(el);
  }
  function addRows() {
    const fragment = document.createDocumentFragment();
    const next = filtered.slice(shown, shown + 40);
    for (const item of next) {
      const row = makeText('article', 'catalog-row', '');
      const head = makeText('div', 'catalog-row-head', '');
      head.appendChild(makeText('h3', '', item.n));
      head.appendChild(makeText('span', 'meta', `${item.b} · ${item.c.map(window.helpCategoryLabel).join(', ')}`));
      row.appendChild(head);
      row.appendChild(makeText('div', 'meta', `${tr('Controller')}: ${item.r || tr('non indicato')} · ${tr('Collegamento')}: ${item.t || tr('non indicato')}`));
      const features = makeText('div', 'features', '');
      addFeature(features, 'Diretto', item.d);
      addFeature(features, 'Effetti', item.e);
      addFeature(features, 'Salvataggio', item.s);
      row.appendChild(features);
      if (item.x) {
        const details = document.createElement('details');
        details.appendChild(makeText('summary', '', tr('Note della fonte OpenRGB')));
        details.appendChild(makeText('p', '', item.x));
        row.appendChild(details);
      }
      fragment.appendChild(row);
    }
    list.appendChild(fragment);
    shown += next.length;
    more.hidden = shown >= filtered.length;
    summary.textContent = window.helpLanguage === 'en' ? `${filtered.length.toLocaleString('en-US')} of ${devices.length.toLocaleString('en-US')} OpenRGB 1.0rc2 records · ${shown.toLocaleString('en-US')} shown` : `${filtered.length.toLocaleString('it-IT')} di ${devices.length.toLocaleString('it-IT')} record OpenRGB 1.0rc2 · ${shown.toLocaleString('it-IT')} visualizzati`;
  }
  function update() {
    const q = search.value.trim().toLocaleLowerCase('it');
    const c = category.value;
    const b = brand.value;
    const d = direct.value;
    filtered = devices.filter(item => {
      if (c && !item.c.includes(c)) return false;
      if (b && item.b !== b) return false;
      if (d === 'yes' && item.d !== '✔️') return false;
      if (d === 'issue' && item.d !== '🚨' && item.d !== '⚒️') return false;
      if (d === 'no' && item.d !== '❌' && item.d !== '🚫' && item.d) return false;
      return !q || `${item.n} ${item.b} ${item.r} ${item.c.join(' ')} ${item.c.map(window.helpCategoryLabel).join(' ')}`.toLocaleLowerCase('it').includes(q);
    });
    shown = 0;
    list.replaceChildren();
    if (filtered.length) addRows();
    else { summary.textContent = window.helpLanguage === 'en' ? `No matches among ${devices.length.toLocaleString('en-US')} OpenRGB 1.0rc2 records.` : `Nessun risultato tra i ${devices.length.toLocaleString('it-IT')} record OpenRGB 1.0rc2.`; more.hidden = true; }
  }
  for (const control of [search, category, brand, direct]) control.addEventListener(control === search ? 'input' : 'change', update);
  more.addEventListener('click', addRows);
  window.helpCatalogUpdate = update;
  update();
})();
</script></body></html>
